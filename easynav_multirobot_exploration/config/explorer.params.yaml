# PROXIMITY POLICY
# 0 = EUCLIDEAN
# 1 = REAL

# SEPARATION POLICY
# 0 = NONE
# 1 = POSITION
# 2 = GOAL

r1/explorer:
  ros__parameters:
    use_sim_time: true
    freq: 2.0 # hz

    map_frame: r1/map
    robot_frame: r1/base_link
    odom_frame: r1/odom

    proximity_policy: 0
    proximity_weight: 0.8
    separation_policy: 1
    separation_weight: 0.7

    still_alive_radius: 1.5
    improvement_ratio: 0.4

