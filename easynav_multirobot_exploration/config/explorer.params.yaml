# NEAREST_FRONTIER 0
# BETTER_FRONTIER 1

r1/explorer:
  ros__parameters:
    use_sim_time: true
    freq: 2.0 # hz

    map_frame: r1/map
    robot_frame: r1/base_link
    odom_frame: r1/odom

    policy: 1 # BETTER_FRONTIER
    separation_weight: 0.7
    distance_weight: 1.0

    proximity_threshold: 0.25
    improvement_ratio: 0.25    

