/**:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    # Sin barras iniciales para que el namespace del launcher funcione correctamente
    scan_topic: scan_raw
    use_map_saver: true
    mode: mapping #localization

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 
    map_update_interval: 0.5
    
    # --- CONFIGURACIÓN CRÍTICA PARA EVITAR CRASH ---
    resolution: 0.05
    min_laser_range: 0.3                  # Evita lecturas del propio chasis
    max_laser_range: 15.0                 # Debe ser mayor que cualquier otro rango/espacio
    # -----------------------------------------------

    minimum_time_interval: 0.2
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000 
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    scan_buffer_size: 15
    scan_buffer_maximum_scan_distance: 10.0
    
    link_match_minimum_response_fine: 0.5  
    link_scan_maximum_distance: 8.0       # Aumentado para facilitar la unión de frames
    loop_search_maximum_distance: 8.0     # Coherente con el espacio de búsqueda
    
    do_loop_closing: true 
    loop_match_minimum_chain_size: 5
    loop_match_maximum_variance_coarse: 3.0  
    loop_match_minimum_response_coarse: 0.25
    loop_match_minimum_response_fine: 0.35

    # Correlation Parameters - Sincronizados con la resolución principal
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.05 # IGUAL a resolution
    correlation_search_space_smear_deviation: 0.1 

    # Loop Closure Parameters
    loop_search_space_dimension: 8.0          # Menor que max_laser_range para evitar error de puntero
    loop_search_space_resolution: 0.05        # IGUAL a resolution
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.4      
    angle_variance_penalty: 1.25    

    fine_search_angle_offset: 0.00436  
    coarse_search_angle_offset: 0.349   
    coarse_angle_resolution: 0.0349        
    minimum_angle_penalty: 0.8
    minimum_distance_penalty: 0.5
    use_response_expansion: true
    min_pass_through: 2
    occupancy_threshold: 0.05